name: Deploy static site to Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate approved team portraits
        shell: bash
        run: |
          set -euo pipefail
          for portrait in \
            assets/img/team/ayush-pipalwa-20260804.jpg \
            assets/img/team/surbhi-sharma.jpg
          do
            test -s "$portrait"
            test "$(head -c 3 "$portrait" | xxd -p)" = "ffd8ff"
            test "$(tail -c 2 "$portrait" | xxd -p)" = "ffd9"
            file "$portrait"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
