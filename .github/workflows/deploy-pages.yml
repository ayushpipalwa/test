name: Deploy static site to Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate live team photo folder
        shell: bash
        run: |
          set -euo pipefail
          photo_folder="assets/img/team/live"
          test -d "$photo_folder"

          photo_count=0
          while IFS= read -r -d '' portrait; do
            photo_count=$((photo_count + 1))
            test -s "$portrait"
            test "$(head -c 3 "$portrait" | xxd -p)" = "ffd8ff"
            test "$(tail -c 2 "$portrait" | xxd -p)" = "ffd9"
            file "$portrait"
          done < <(find "$photo_folder" -maxdepth 1 -type f -name '*.jpg' -print0)

          test "$photo_count" -gt 0
          echo "Validated $photo_count live team portrait(s)."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
