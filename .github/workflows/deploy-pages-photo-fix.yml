name: Deploy Pages with verified team photos

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode verified Ayush portrait
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode assets/img/team/ayush-pipalwa-20260802.jpg.b64 > assets/img/team/ayush-pipalwa.jpg
          cp assets/img/team/ayush-pipalwa.jpg assets/img/team/Ayush.jpeg
          file assets/img/team/ayush-pipalwa.jpg
          test -s assets/img/team/ayush-pipalwa.jpg
          # Force browsers/CDN to request the new asset.
          sed -i 's/ayush-pipalwa.jpg?v=20260801/ayush-pipalwa.jpg?v=202608022245/g' assets/js/main.js
          sed -i 's/Ayush.jpeg/Ayush.jpeg?v=202608022245/g' assets/js/main.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
